<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Riya George — AI Engineer</title>
  <meta name="description" content="Riya George - AI Engineer specializing in agentic systems, voice AI, and production AI infrastructure." />
  <meta property="og:title" content="Riya George — AI Engineer" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://riyageorgek.github.io" />
  <meta property="og:description" content="I build AI systems that reason, act, and integrate with the real world." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div id="root"></div>
  <script>
    // Cache busting: Check if app version has changed
    (function() {
      const lastBuildTime = localStorage.getItem('app_build_time');
      const currentTime = new Date().toISOString().split('T')[0]; // Use date only, not full timestamp
      
      if (lastBuildTime && lastBuildTime !== currentTime) {
        console.log('New version detected. Clearing cache...');
        localStorage.clear();
        // Hard refresh to get latest version
        window.location.href = window.location.href;
        return;
      }
      
      localStorage.setItem('app_build_time', currentTime);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Cache busting and version check -->
</body>
</html>
